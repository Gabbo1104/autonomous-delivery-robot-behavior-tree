[project]
name = "robot-consegne"
version = "0.1.0"
description = "Robot di consegna simulato con behavior tree (py_trees)"
authors = [
    { name = "Gabbo1104", email = "sulpizio.gabriele.11052004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "py-trees>=2.6.0",
    "rich>=15.0.0",
]

[project.scripts]
robot = "robot_consegne.main:main"
robot-tui = "robot_consegne.tui:main"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
